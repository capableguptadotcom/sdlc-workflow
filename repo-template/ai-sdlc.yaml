schema_version: 2

commands:
  # Fill these during adoption. Use lists when the repository has multiple apps.
  format: []
  lint: []
  typecheck: []
  unit_test: []
  integration_test: []
  build: []
  security: []

paths:
  specs: specs
  decisions: docs/adr
  initiatives: initiatives
  context_entry: CONTEXT.md
  transient_handoffs: artifacts/ai/handoffs

artifact_profiles:
  spec: ai-sdlc-v1
  adr: ai-sdlc-v1
  context: glossary-v1

workflows:
  develop:
    trigger: manual
    model: inherit
    skills: [diagnose-failure, shape-change, plan-change, implement-slice, finish]
  finish:
    trigger: manual
    model: inherit
    skills: [review-change, simplify-change]
  learn:
    trigger: manual
    model: inherit
    skills: [handoff-and-teach]
  security-review:
    trigger: manual-or-pr-policy
    model: inherit
    required_for_risk_tiers: [0]

gates:
  pre_commit:
    networked_ai: false
    allowed: [format, lint, secret-scan, cheap-changed-file-checks]
  pre_push:
    networked_ai: false
    allowed: [typecheck, targeted-tests, build]
  pull_request:
    required: [full-tests, security, policy, evidence]
  merge:
    required: [protected-branch-checks, code-owner-review]

evidence:
  require_for_behavior_change:
    - acceptance-criteria-mapping
    - deterministic-command-results
    - tests-added-or-rationale
    - known-limitations
