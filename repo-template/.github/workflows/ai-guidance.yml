name: AI guidance validation

on:
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - ai-sdlc.yaml
      - .agents/**
      - .ai/**
      - .claude/**
      - .github/copilot-instructions.md
      - evals/**
      - scripts/validate_ai_kit.py
  push:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - ai-sdlc.yaml
      - .agents/**
      - .ai/**
      - .claude/**
      - .github/copilot-instructions.md
      - evals/**
      - scripts/validate_ai_kit.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_ai_kit.py
