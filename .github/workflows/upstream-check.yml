name: Check reviewed skill sources

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_skill_updates.py --fail-on-update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
