name: Validate AI Developer Kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: python repo-template/scripts/render_walkthrough.py --check
      - run: python repo-template/scripts/validate_ai_kit.py
